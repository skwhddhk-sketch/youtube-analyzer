<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Viral Radar v22</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="top">
      <div class="topin">
        <div class="brand">
          <div class="logo">▶</div>
          Viral Radar <span class="subtle">v22</span>
        </div>
        <div class="nav" id="nav"></div>
        <div class="api">
          <input
            id="apiKey"
            type="password"
            placeholder="YouTube API Key"
          /><button class="btn light" onclick="saveKey()">저장</button
          ><button class="btn light" onclick="toggleDemo()" id="demoBtn">
            Demo ON
          </button>
        </div>
      </div>
    </div>
    <div class="wrap">
      <div class="hero">
        <div>
          <h1 id="pageTitle">홈</h1>
          <p id="pageDesc">
            내 관심사 기반으로 터질만한 영상과 주제를 빠르게 보는 화면.
          </p>
        </div>
        <div class="rightBtns">
          <button class="btn light" onclick="exportFavorites()">
            즐겨찾기 내보내기</button
          ><button
            class="btn light"
            onclick="document.getElementById('importFile').click()"
          >
            가져오기</button
          ><input
            type="file"
            id="importFile"
            hidden
            onchange="importFavorites(event)"
          />
        </div>
      </div>
      <section id="home" class="tabs active"></section>
      <section id="search" class="tabs"></section>
      <section id="trend" class="tabs"></section>
      <section id="channel" class="tabs"></section>
      <section id="fav" class="tabs"></section>
      <section id="planner" class="tabs"></section>
      <section id="brief" class="tabs"></section>
      <section id="settings" class="tabs"></section>
    </div>
    <div class="drawer hidden" id="drawer">
      <div class="din">
        <button class="close" onclick="closeDrawer()">×</button>
        <div id="drawerBody"></div>
      </div>
    </div>
    <div class="toast" id="toast"></div>

    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/api.js"></script>
    <script src="js/table.js"></script>
    <script src="js/drawer.js"></script>
    <script src="js/favorites.js"></script>
    <script src="js/planner.js"></script>
    <script src="js/home.js"></script>
    <script src="js/search.js"></script>
    <script src="js/trend.js"></script>
    <script src="js/channel.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/brief.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
