<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Viral Radar v12</title>
<link rel="stylesheet" href="css/style.css"></head><body>
<div class="top"><div class="topin"><div class="brand"><div class="logo">▶</div>Viral Radar <span class="subtle">v12</span></div><div class="nav" id="nav"></div><div class="api"><input id="apiKey" type="password" placeholder="YouTube API Key"><button class="btn light" onclick="saveKey()">저장</button><button class="btn light" onclick="toggleDemo()" id="demoBtn">Demo ON</button></div></div></div>
<div class="wrap">
 <div class="hero"><div><h1 id="pageTitle">홈</h1><p id="pageDesc">내 관심사 기반으로 터질만한 영상과 주제를 빠르게 보는 화면.</p></div><div class="rightBtns"><button class="btn light" onclick="exportFavorites()">즐겨찾기 내보내기</button><button class="btn light" onclick="document.getElementById('importFile').click()">가져오기</button><input type="file" id="importFile" hidden onchange="importFavorites(event)"></div></div>
 <section id="home" class="tabs active"></section><section id="search" class="tabs"></section><section id="trend" class="tabs"></section><section id="channel" class="tabs"></section><section id="fav" class="tabs"></section><section id="planner" class="tabs"></section><section id="brief" class="tabs"></section><section id="settings" class="tabs"></section>
</div>
<div class="drawer hidden" id="drawer"><div class="din"><button class="close" onclick="closeDrawer()">×</button><div id="drawerBody"></div></div></div><div class="toast" id="toast"></div>
<script>
const TABS=[['home','홈'],['search','검색'],['trend','Hot Trend'],['channel','채널 분석'],['fav','즐겨찾기'],['planner','기획 보드'],['brief','제작안'],['settings','설정']];
const qs=s=>document.querySelector(s); const qsa=s=>[...document.querySelectorAll(s)];
let API=localStorage.getItem('vr_api_key')||''; let demo=localStorage.getItem('vr_demo')!=='off'; let current=[]; qs('#apiKey').value=API; updateDemoBtn();
const defaultInterests=['강아지','동물 감동','웃긴 쇼츠','군인 감동','육아','AI 영상','다이어트','헬스','맛집','돈 공부'];
function getInterests(){return JSON.parse(localStorage.getItem('vr_interests')||JSON.stringify(defaultInterests))}
function setInterests(v){localStorage.setItem('vr_interests',JSON.stringify(v))}
const countries={KR:'한국',US:'미국',JP:'일본',GB:'영국',GLOBAL:'글로벌'};
const demoVideos=[
 {id:'d1',title:'군인을 본 아기가 갑자기 경례를 했다',channel:'Tiny Moment',subs:8200,views:690000,avg:21000,hours:9,likes:41000,comments:1800,duration:34,country:'KR',cat:'감동',thumb:'https://i.ytimg.com/vi/aqz-KE-bpKQ/hqdefault.jpg'},
 {id:'d2',title:'잘생긴 남자 때문에 하루 세끼 맥날 먹은 썰',channel:'Story Shorts',subs:17000,views:1180000,avg:54000,hours:14,likes:72000,comments:3100,duration:52,country:'KR',cat:'웃긴 쇼츠',thumb:'https://i.ytimg.com/vi/tgbNymZ7vqY/hqdefault.jpg'},
 {id:'d3',title:'강아지가 원반 잡는 순간 모두가 소리쳤다',channel:'Dog Hero',subs:2400,views:310000,avg:6200,hours:7,likes:22000,comments:920,duration:24,country:'KR',cat:'동물',thumb:'https://i.ytimg.com/vi/jNQXAC9IVRw/hqdefault.jpg'},
 {id:'d4',title:'I tried this AI video trick for 7 days',channel:'AI Creator Lab',subs:56000,views:940000,avg:120000,hours:21,likes:38000,comments:1400,duration:480,country:'US',cat:'AI',thumb:'https://i.ytimg.com/vi/M7lc1UVf-VE/hqdefault.jpg'},
 {id:'d5',title:'엄마가 체조를 시켰더니 아기 표정이...',channel:'Baby Clip',subs:3900,views:430000,avg:9000,hours:11,likes:26000,comments:760,duration:29,country:'KR',cat:'육아',thumb:'https://i.ytimg.com/vi/ScMzIvxBSi4/hqdefault.jpg'},
 {id:'d6',title:'Nobody expected this football dad training at home',channel:'Family Sports',subs:12500,views:870000,avg:35000,hours:18,likes:51000,comments:2100,duration:41,country:'US',cat:'스포츠',thumb:'https://i.ytimg.com/vi/e-ORhEE9VVg/hqdefault.jpg'},
 {id:'d7',title:'일산 운동 전 먹기 좋은 밥집 TOP 5',channel:'Local Food',subs:9800,views:122000,avg:17000,hours:30,likes:5400,comments:320,duration:610,country:'KR',cat:'맛집',thumb:'https://i.ytimg.com/vi/ysz5S6PUM-U/hqdefault.jpg'},
 {id:'d8',title:'月5万円で始めるインデックス投資',channel:'Money JP',subs:41000,views:520000,avg:76000,hours:27,likes:18000,comments:1100,duration:720,country:'JP',cat:'경제',thumb:'https://i.ytimg.com/vi/kJQP7kiw5Fk/hqdefault.jpg'},
 {id:'d9',title:'I lost 20kg with this simple beginner gym split',channel:'Fit Basic',subs:22000,views:780000,avg:64000,hours:33,likes:30000,comments:1500,duration:540,country:'US',cat:'헬스',thumb:'https://i.ytimg.com/vi/LXb3EKWsInQ/hqdefault.jpg'},
 {id:'d10',title:'쇼츠 자막 지우는 가장 쉬운 방법',channel:'Creator Fix',subs:6800,views:205000,avg:11000,hours:16,likes:9900,comments:420,duration:380,country:'KR',cat:'AI 영상',thumb:'https://i.ytimg.com/vi/2Vv-BfVoq4g/hqdefault.jpg'}
];
function calc(v){v.rSub=v.subs? v.views/v.subs:0; v.rAvg=v.avg? v.views/v.avg:0; v.vph=v.hours? v.views/v.hours:0; v.likeRate=v.views? v.likes/v.views*100:0; v.commentRate=v.views? v.comments/v.views*100:0; v.score=Math.min(99,Math.round((Math.min(v.rSub,100)*.28)+(Math.min(v.rAvg,60)*.55)+(Math.min(v.vph/1000,30)*.7)+(v.duration<=60?8:3)+(v.commentRate*22))); v.rep=Math.max(30,Math.min(98,Math.round(70+(v.duration<=60?10:-5)+(v.subs<30000?8:0)+(v.rAvg>8?8:0)-(v.cat==='AI'?2:0)))); return v}
function fmt(n){if(!n&&n!==0)return'-'; if(n>=100000000)return (n/100000000).toFixed(1)+'억'; if(n>=10000)return (n/10000).toFixed(1)+'만'; if(n>=1000)return (n/1000).toFixed(1)+'천'; return String(Math.round(n))}
function scoreCls(s){return s>=80?'':s>=60?'mid':'low'}
function nav(){qs('#nav').innerHTML=TABS.map(([id,n])=>`<button onclick="go('${id}')" data-tab="${id}" class="${id==='home'?'active':''}">${n}</button>`).join('')}
function go(id){qsa('.tabs').forEach(x=>x.classList.remove('active')); qs('#'+id).classList.add('active'); qsa('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===id)); const map={home:['홈','내 관심사 기반 기본 피드'],search:['검색','키워드로 아웃라이어 영상 찾기'],trend:['Hot Trend','나라별 지금 뜨는 주제 보기'],channel:['채널 분석','궁금한 채널의 성공 패턴 분석'],fav:['즐겨찾기','저장한 영상 다시 보기'],planner:['기획 보드','따라 만들 소재를 기획안으로 바꾸기'],brief:['제작안','저장한 영상을 쇼츠 제작안으로 변환'],settings:['설정','관심사와 API 설정']}; qs('#pageTitle').textContent=map[id][0]; qs('#pageDesc').textContent=map[id][1]; if(id==='fav')renderFav(); if(id==='planner')renderPlanner(); if(id==='brief')renderBrief()}
function saveKey(){API=qs('#apiKey').value.trim(); localStorage.setItem('vr_api_key',API); toast('API 키 저장됨')}
function toggleDemo(){demo=!demo; localStorage.setItem('vr_demo',demo?'on':'off'); updateDemoBtn(); toast(demo?'Demo ON':'Demo OFF')}
function updateDemoBtn(){setTimeout(()=>{let b=qs('#demoBtn'); if(b)b.textContent=demo?'Demo ON':'Demo OFF'},0)}
function toast(t){let el=qs('#toast'); el.textContent=t; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),1600)}
function seed(q='',country='GLOBAL',shorts=true){let arr=demoVideos.map(x=>calc({...x})); if(country!=='GLOBAL')arr=arr.filter(v=>v.country===country); if(q)arr=arr.filter(v=>(v.title+v.channel+v.cat).toLowerCase().includes(q.toLowerCase())); if(!shorts)arr=arr.filter(v=>v.duration>60); return arr.sort((a,b)=>b.score-a.score)}
function table(vs){current=vs; if(!vs.length)return '<div class="empty">결과 없음</div>'; return `<div class="table"><div class="thead"><div>순위</div><div>영상</div><div>점수</div><div>조회수</div><div>VPH</div><div>구독자比</div><div>평균比</div><div>판정</div><div>저장</div></div>${vs.map((v,i)=>row(v,i)).join('')}</div>`}
function row(v,i){return `<div class="row" onclick="openVideo('${v.id}')"><div><b>#${i+1}</b></div><div class="video"><img class="thumb" src="${v.thumb}"><div><div class="vtitle">${v.title}</div><div class="meta">${v.channel} · ${v.duration<=60?'Shorts':'Long'} · ${countries[v.country]||v.country}</div></div></div><div><span class="score ${scoreCls(v.score)}">${v.score}</span></div><div class="cell"><strong>${fmt(v.views)}</strong><small>${v.hours}시간 전</small></div><div class="cell"><strong>${fmt(v.vph)}</strong><small>/hour</small></div><div class="cell"><strong>${v.rSub.toFixed(1)}x</strong><small>subs</small></div><div class="cell"><strong>${v.rAvg.toFixed(1)}x</strong><small>avg</small></div><div>${judge(v)}</div><div><button class="star ${isFav(v.id)?'on':''}" onclick="event.stopPropagation();favToggle('${v.id}')">★</button></div></div>`}
function judge(v){if(v.score>=85)return '<span class="badge hot">🔥 강력</span>'; if(v.rAvg>=8)return '<span class="badge good">채널 대비</span>'; if(v.vph>=10000)return '<span class="badge warn">VPH</span>'; return '<span class="badge">보통</span>'}
function findVideo(id){return [...demoVideos.map(x=>calc({...x})),...current].find(v=>v.id===id)}
function titleType(t){if(/하지마|절대|망|위험|손해/.test(t))return '금지/경고형'; if(/TOP|top|\d+/.test(t))return '리스트형'; if(/봤|tried|해봤|7일|한달/.test(t))return '실험/후기형'; if(/갑자기|순간|모두|nobody|expected/.test(t))return '반전/순간형'; return '호기심형'}
function insights(v){let type=titleType(v.title); return [`제목은 <b>${type}</b>. 클릭 전에 감정 트리거가 명확한 편이다.`,`채널 평균 대비 <b>${v.rAvg.toFixed(1)}배</b>라서 기존 구독자빨보다 소재 자체 반응 가능성이 높다.`,`VPH <b>${fmt(v.vph)}</b> 기준 초기 확산 속도가 ${v.vph>10000?'매우 강함':'보통 이상'}이다.`,`${v.duration<=60?'쇼츠형이라 복제 난이도가 낮고 빠른 테스트에 적합하다.':'롱폼이라 소재 검증 후 쇼츠로 재가공 가능하다.'}`]}
function openVideo(id){let v=findVideo(id); if(!v)return; qs('#drawer').classList.remove('hidden'); qs('#drawerBody').innerHTML=`<h2>${v.title}</h2><div class="meta">${v.channel} · ${countries[v.country]} · ${v.cat}</div><img class="dthumb" src="${v.thumb}"><div class="summary" style="grid-template-columns:repeat(2,1fr)"><div class="stat"><span>AI 점수</span><strong>${v.score}</strong></div><div class="stat"><span>복제 가능성</span><strong>${v.rep}</strong></div><div class="stat"><span>평균 대비</span><strong>${v.rAvg.toFixed(1)}x</strong></div><div class="stat"><span>VPH</span><strong>${fmt(v.vph)}</strong></div></div><div class="insight"><h3>맞춤 인사이트</h3><ul>${insights(v).map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="insight"><h3>따라 만들 때 바꿀 포인트</h3><ul><li>제목 구조는 유지하고 대상만 바꾸기: “${remixTitle(v.title)}”</li><li>썸네일은 주인공 1명/1마리 + 큰 감정 + 3~5단어 텍스트가 적합.</li><li>첫 1초는 결과 장면부터 보여주고, 설명은 뒤로 미루기.</li></ul></div><textarea class="memo" placeholder="이 영상에서 배운 점 메모" oninput="saveMemo('${v.id}',this.value)">${getMemo(v.id)}</textarea><br><br><button class="btn red" onclick="favToggle('${v.id}');openVideo('${v.id}')">${isFav(v.id)?'즐겨찾기 해제':'즐겨찾기 저장'}</button> <button class="btn light" onclick="addPlan('${v.id}')">기획 보드에 추가</button>`}
function closeDrawer(){qs('#drawer').classList.add('hidden')}
function remixTitle(t){if(t.includes('강아지'))return t.replace('강아지','고양이'); if(t.includes('아기'))return t.replace('아기','강아지'); if(t.includes('AI'))return t.replace('AI','쇼츠'); return t+' 2탄'}
function favs(){return JSON.parse(localStorage.getItem('vr_favs')||'[]')} function setFavs(x){localStorage.setItem('vr_favs',JSON.stringify(x))} function isFav(id){return favs().includes(id)}
function favToggle(id){let f=favs(); f=f.includes(id)?f.filter(x=>x!==id):[id,...f]; setFavs(f); toast(f.includes(id)?'저장됨':'해제됨'); renderAll()}
function getMemo(id){return JSON.parse(localStorage.getItem('vr_memo')||'{}')[id]||''} function saveMemo(id,t){let m=JSON.parse(localStorage.getItem('vr_memo')||'{}'); m[id]=t; localStorage.setItem('vr_memo',JSON.stringify(m))}
function plans(){return JSON.parse(localStorage.getItem('vr_plans')||'[]')} function setPlans(p){localStorage.setItem('vr_plans',JSON.stringify(p))} function addPlan(id){let p=plans(); if(!p.includes(id))p.unshift(id); setPlans(p); toast('기획 보드에 추가됨')}
function renderHome(){let vs=seed('', 'GLOBAL', true).filter(v=>getInterests().some(k=>(v.title+v.cat).includes(k.replace(' 영상','')))).slice(0,8); if(vs.length<4)vs=seed('', 'GLOBAL', true).slice(0,8); qs('#home').innerHTML=`<div class="summary"><div class="stat"><span>오늘 추천</span><strong>${vs.length}</strong></div><div class="stat"><span>강력 후보</span><strong>${vs.filter(v=>v.score>=85).length}</strong></div><div class="stat"><span>평균 VPH</span><strong>${fmt(vs.reduce((a,b)=>a+b.vph,0)/vs.length)}</strong></div><div class="stat"><span>저장 영상</span><strong>${favs().length}</strong></div><div class="stat"><span>데모 상태</span><strong>${demo?'ON':'OFF'}</strong></div></div><div class="grid2"><div><div class="titlebar"><div><h2>내 관심사 추천</h2><p>작은 채널인데 크게 튄 영상 우선</p></div></div>${table(vs)}</div><div><div class="panel"><h2 style="margin-top:0">오늘 볼 주제</h2><div class="cards" style="grid-template-columns:1fr">${['동물 순간 포착','아기 리액션','AI 쇼츠 편집법','헬스 초보 루틴'].map(x=>`<div class="mini" onclick="go('search');setTimeout(()=>{qs('#searchQ').value='${x.split(' ')[0]}';runSearch()},50)"><b>${x}</b><p>조회수보다 구독자 대비 반응 확인</p></div>`).join('')}</div></div><div class="panel"><h2 style="margin-top:0">다음 액션</h2><p class="subtle">저장 → 기획 보드 추가 → 제목 변형안 작성 순서로 쓰면 됨.</p></div></div></div>`}
function renderSearch(){qs('#search').innerHTML=`<div class="panel"><div class="controls"><input id="searchQ" class="wide" placeholder="키워드 입력: 강아지, AI, 헬스..."><select id="searchCountry">${Object.entries(countries).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><label class="check"><input id="searchShorts" type="checkbox" checked>Shorts 포함</label><button class="btn red" onclick="runSearch()">검색</button></div><div class="chips">${getInterests().map(k=>`<button class="chip" onclick="qs('#searchQ').value='${k}';runSearch()">${k}</button>`).join('')}</div></div><div id="searchResult">${table(seed('', 'GLOBAL', true).slice(0,8))}</div>`}
async function runSearch(){let q=qs('#searchQ').value.trim(); let c=qs('#searchCountry').value; let shorts=qs('#searchShorts').checked; if(!demo&&!API){toast('API 키가 필요함');return} let vs=seed(q,c,shorts).slice(0,12); qs('#searchResult').innerHTML=table(vs)}
function renderTrend(){qs('#trend').innerHTML=`<div class="panel"><div class="controls"><select id="trendCountry">${Object.entries(countries).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><select id="trendCat"><option value="">전체 주제</option>${[...new Set(demoVideos.map(v=>v.cat))].map(c=>`<option>${c}</option>`).join('')}</select><label class="check"><input id="trendShorts" type="checkbox" checked>Shorts 포함</label><button class="btn red" onclick="runTrend()">트렌드 조회</button></div></div><div id="trendResult"></div>`; runTrend()}
function runTrend(){let c=qs('#trendCountry').value, cat=qs('#trendCat').value, shorts=qs('#trendShorts').checked; let vs=seed('',c,shorts).filter(v=>!cat||v.cat===cat).slice(0,12); let topics={}; vs.forEach(v=>topics[v.cat]=(topics[v.cat]||0)+1); qs('#trendResult').innerHTML=`<div class="cards">${Object.entries(topics).map(([k,n])=>`<div class="mini"><b>${k}</b><p>후보 ${n}개 · 평균 점수 ${Math.round(vs.filter(v=>v.cat===k).reduce((a,b)=>a+b.score,0)/n)}</p></div>`).join('')}</div><br>${table(vs)}`}
function renderChannel(){qs('#channel').innerHTML=`<div class="panel"><div class="controls"><input id="chQ" class="wide" placeholder="채널명 입력"><button class="btn red" onclick="runChannel()">채널 분석</button></div></div><div id="chResult"><div class="empty">예: Dog Hero, AI Creator Lab, Local Food</div></div>`}
function runChannel(){let q=qs('#chQ').value.trim().toLowerCase(); let vs=demoVideos.map(x=>calc({...x})).filter(v=>!q||v.channel.toLowerCase().includes(q)); if(!vs.length){qs('#chResult').innerHTML='<div class="empty">채널 결과 없음</div>';return} let avg=vs.reduce((a,b)=>a+b.views,0)/vs.length, med=[...vs].sort((a,b)=>a.views-b.views)[Math.floor(vs.length/2)].views, shorts=vs.filter(v=>v.duration<=60).length; let best=[...vs].sort((a,b)=>b.rAvg-a.rAvg)[0]; qs('#chResult').innerHTML=`<div class="summary"><div class="stat"><span>분석 영상</span><strong>${vs.length}</strong></div><div class="stat"><span>평균 조회수</span><strong>${fmt(avg)}</strong></div><div class="stat"><span>중앙 조회수</span><strong>${fmt(med)}</strong></div><div class="stat"><span>Shorts 비율</span><strong>${Math.round(shorts/vs.length*100)}%</strong></div><div class="stat"><span>최고 아웃라이어</span><strong>${best.rAvg.toFixed(1)}x</strong></div></div><div class="panel"><h2 style="margin-top:0">채널 진단</h2><div class="kpi"><div><b>성공 패턴</b><p class="subtle">${titleType(best.title)} 제목이 가장 강함</p></div><div><b>추천 방향</b><p class="subtle">상위 영상의 감정/순간 구조를 반복 테스트</p></div><div><b>주의점</b><p class="subtle">평균 조회수보다 중앙 조회수를 기준선으로 보는 게 안전</p></div></div></div>${table(vs)}`}
function renderFav(){let vs=favs().map(findVideo).filter(Boolean).map(x=>calc({...x})); qs('#fav').innerHTML=`<div class="panel"><div class="controls"><button class="btn light" onclick="setFavs([]);renderFav();toast('전체 삭제됨')">전체 삭제</button><button class="btn light" onclick="exportFavorites()">내보내기</button></div></div>${vs.length?table(vs):'<div class="empty">저장한 영상 없음</div>'}`}
function renderPlanner(){let vs=plans().map(findVideo).filter(Boolean).map(x=>calc({...x})); qs('#planner').innerHTML=`<div class="planner">${vs.map(v=>`<div class="plan"><h3>${v.title}</h3><p class="subtle">복제 가능성 ${v.rep}점 · ${titleType(v.title)}</p><ul><li>훅: 결과 장면 먼저</li><li>제목: ${remixTitle(v.title)}</li><li>촬영: 원본 감정 구조만 차용</li></ul><button class="btn light" onclick="setPlans(plans().filter(x=>x!=='${v.id}'));renderPlanner()">삭제</button></div>`).join('')||'<div class="empty">기획 보드에 추가한 영상 없음</div>'}</div>`}
function renderSettings(){let ints=getInterests(); qs('#settings').innerHTML=`<div class="panel"><h2 style="margin-top:0">내 관심사 관리</h2><p class="subtle">홈 탭과 검색 추천 칩에 바로 반영됨.</p><div class="controls"><input id="newInterest" class="wide" placeholder="예: 고양이, 쇼츠 편집, 경제뉴스"><button class="btn red" onclick="addInterest()">추가</button><button class="btn light" onclick="resetInterests()">기본값 복원</button></div><div class="chips">${ints.map(k=>`<button class="chip" onclick="removeInterest('${k}')">${k} ×</button>`).join('')}</div></div><div class="panel"><h2 style="margin-top:0">검색 사용 전략</h2><div class="kpi"><div><b>추천 방식</b><p class="subtle">Demo ON에서 화면 테스트 → API 리셋 후 실제 검색</p></div><div><b>쿼터 절약</b><p class="subtle">핫트렌드/채널분석은 필요한 키워드만 실행</p></div><div><b>저장 루틴</b><p class="subtle">좋은 영상은 즐겨찾기 → 기획 보드 → JSON 백업</p></div></div></div><div class="panel"><h2 style="margin-top:0">쿼터 절약 원칙</h2><ul><li>자동 조회 OFF</li><li>Demo ON 상태에서 UI 먼저 테스트</li><li>API 리셋 후 필요한 검색만 실행</li><li>GitHub Pages 배포 전 API 키는 HTML에 넣지 않기</li></ul></div>`}
function addInterest(){let v=qs('#newInterest').value.trim(); if(!v)return; let ints=getInterests(); if(!ints.includes(v)) ints.unshift(v); setInterests(ints.slice(0,20)); renderAll(); toast('관심사 추가됨')}
function removeInterest(v){setInterests(getInterests().filter(x=>x!==v)); renderAll(); toast('관심사 삭제됨')}
function resetInterests(){setInterests(defaultInterests); renderAll(); toast('기본값 복원됨')}
function exportFavorites(){let data={favs:favs(),plans:plans(),memo:JSON.parse(localStorage.getItem('vr_memo')||'{}')}; let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='viral-radar-data.json'; a.click()}
function importFavorites(e){let f=e.target.files[0]; if(!f)return; let r=new FileReader(); r.onload=()=>{try{let d=JSON.parse(r.result); if(d.favs)setFavs(d.favs); if(d.plans)setPlans(d.plans); if(d.memo)localStorage.setItem('vr_memo',JSON.stringify(d.memo)); renderAll(); toast('가져오기 완료')}catch(err){toast('파일 오류')}}; r.readAsText(f)}

function briefText(v){v=calc({...v}); let tone=titleType(v.title); return `# 쇼츠 제작안\n\n원본 참고: ${v.title}\n채널: ${v.channel}\n판정: AI ${v.score}점 / 복제 가능성 ${v.rep}점 / 평균 대비 ${v.rAvg.toFixed(1)}x\n\n## 1. 핵심 콘셉트\n${tone} 구조를 활용해서 결과 장면을 먼저 보여주는 쇼츠. 감정은 호기심 → 반전 → 공감 순서로 설계.\n\n## 2. 제목 후보\n1) ${remixTitle(v.title)}\n2) 이 장면 보고 다들 멈칫함\n3) 처음엔 평범했는데 마지막이 미쳤다\n\n## 3. 첫 3초 훅\n- 0.0초: 가장 강한 결과 장면 먼저 노출\n- 0.5초: 화면 중앙에 짧은 문구 5~8자\n- 1.5초: 왜 이런 일이 생겼는지 궁금하게 컷 전환\n\n## 4. 컷 구성\n- 0~3초: 결말/리액션 선공개\n- 3~8초: 상황 설명 최소화\n- 8~18초: 핵심 장면 반복/확대\n- 18~25초: 반전 또는 감정 마무리\n- 마지막 1초: 댓글 유도 문장\n\n## 5. 썸네일 가이드\n주인공을 크게 배치하고, 표정/동작이 바로 보이게 잡기. 텍스트는 3~5단어만 사용.\n\n## 6. 자막 톤\n짧게, 크게, 한 줄 위주. 설명보다 반응을 먼저 넣기.\n\n## 7. 댓글 유도\n\"이 장면 다시 봐도 신기하지 않음?\"`;}
function renderBrief(){let ids=[...plans(),...favs()]; let vs=ids.map(findVideo).filter(Boolean); if(!vs.length)vs=seed('', 'GLOBAL', true).slice(0,5); qs('#brief').innerHTML=`<div class="panel"><h2 style="margin-top:0">쇼츠 제작안 생성기</h2><p class="subtle">기획 보드/즐겨찾기 영상 기반으로 제목, 훅, 컷 구성, 썸네일 가이드를 자동 작성.</p><div class="controls"><select id="briefPick" class="wide">${vs.map(v=>`<option value="${v.id}">${v.title}</option>`).join('')}</select><button class="btn red" onclick="makeBrief()">제작안 생성</button><button class="btn light" onclick="copyBrief()">복사</button></div></div><textarea id="briefOut" class="memo" style="min-height:520px;font-family:ui-monospace,Consolas,monospace;line-height:1.55" placeholder="제작안 생성 버튼을 눌러줘."></textarea>`}
function makeBrief(){let id=qs('#briefPick').value; let v=findVideo(id); qs('#briefOut').value=briefText(v); toast('제작안 생성됨')}
function copyBrief(){let el=qs('#briefOut'); el.select(); document.execCommand('copy'); toast('복사됨')}

function renderAll(){renderHome();renderSearch();renderTrend();renderChannel();renderFav();renderPlanner();renderBrief();renderSettings(); updateDemoBtn()}
nav(); renderAll();
</script></body></html>
